[agent.alignenv]
description = "AlignEnv Modal Qwen-based AAC API"
provider = "alignenv"
model = "alignenv:aac-interpreter" # informational only; no pydantic-ai agent is built for this profile
endpoint_url = "https://pablotanoretamales--alignenv-aac-interpreter-api.modal.run"
system_prompt = "Delegated to external AlignEnv API"
prompt_template = "Delegated to external AlignEnv API"
